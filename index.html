    <script>
      (function __checkSwUpdate() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) {
              r.update();
              r.onupdatefound = function() {
                var installing = r.installing;
                if (installing) {
                  installing.onstatechange = function() {
                    if (installing.state === "installed" && navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                  };
                }
              };
            }
          });
        }
      })();
    </script>
  
  
    <script id="cache-buster">
      (function() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var reg of registrations) {
              reg.update();
            }
          });
        }
      })();
    </script>

  
    <script>
      if (typeof Map !== "undefined" && !Map.prototype.getOrInsertComputed) {
        Map.prototype.getOrInsertComputed = function(key, callback) {
          if (this.has(key)) return this.get(key);
          var value = callback(key);
          this.set(key, value);
          return value;
        };
      }
      if (typeof Promise !== "undefined" && typeof Promise.withResolvers === "undefined") {
        Promise.withResolvers = function() {
          var resolve, reject;
          var promise = new Promise(function(res, rej) {
            resolve = res;
            reject = rej;
          });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }
    </script>
